<title>Blind Grading</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1c1b19;--mute:#6b6861;--line:#e3e0d8;--acc:#b3261e;--accbg:#fbe9e7;--code:#f1efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1b1b19;--ink:#ecebe7;--mute:#9a978f;--line:#2d2c29;--acc:#f2766b;--accbg:#3a1b18;--code:#242320}}
:root[data-theme="dark"]{--bg:#121211;--card:#1b1b19;--ink:#ecebe7;--mute:#9a978f;--line:#2d2c29;--acc:#f2766b;--accbg:#3a1b18;--code:#242320}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar button.n{min-width:36px}
.bar .done{background:var(--accbg);border-color:var(--acc)}
.bar .cur{outline:2px solid var(--acc)}
.status{margin-left:auto;color:var(--mute);font-size:13px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:16px 0}
summary{cursor:pointer;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.pair{grid-template-columns:1fr}}
.ans{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;overflow-wrap:anywhere}
.ans h2{margin:0 0 8px;font-size:18px}
.ans.pick{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
pre{background:var(--code);padding:10px;border-radius:6px;overflow-x:auto;font-size:13px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.vote{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.vote button{padding:10px 22px;font-weight:600}
.vote button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.nav{display:flex;justify-content:space-between}
.wc{color:var(--mute);font-size:12px;font-weight:400}
</style>
<main>
<h1>Blind grading: sealed-council benchmark</h1>
<p class="sub">Each task has two answers, X and Y. One is a single agent, one is the council. Pick the better answer for the brief, or tie. You never see which is which.</p>
<div class="bar" id="bar"></div>
<div id="task"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
const TASKS = __DATA__;
let cur = 0, grades = {}, ref = null, saveMsg = "Saved only in this view until sign-in loads";
try { grades = JSON.parse(localStorage.getItem("sc-grades") || "{}"); } catch (e) {}
const md = s => DOMPurify.sanitize(marked.parse(s));
const words = s => s.trim().split(/\s+/).length;

function render() {
  const bar = document.getElementById("bar");
  bar.innerHTML = "";
  TASKS.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "n" + (grades[t.id] ? " done" : "") + (i === cur ? " cur" : "");
    b.textContent = i + 1;
    b.onclick = () => { cur = i; render(); scrollTo(0, 0); };
    bar.appendChild(b);
  });
  const st = document.createElement("span");
  st.className = "status";
  st.textContent = Object.keys(grades).length + "/" + TASKS.length + " graded. " + saveMsg;
  bar.appendChild(st);

  const t = TASKS[cur], g = grades[t.id];
  const el = document.getElementById("task");
  el.innerHTML =
    '<details open><summary>Task ' + (cur + 1) + ': the brief</summary><div id="brief"></div></details>' +
    '<div class="pair">' +
    '<div class="ans' + (g === "X" ? " pick" : "") + '"><h2>X</h2><div id="ax"></div></div>' +
    '<div class="ans' + (g === "Y" ? " pick" : "") + '"><h2>Y</h2><div id="ay"></div></div>' +
    '</div><div class="vote"></div>' +
    '<div class="nav"><button id="prev">Previous</button><button id="next">Next</button></div>';
  el.querySelector("#brief").innerHTML = md(t.brief);
  el.querySelector("#ax").innerHTML = md(t.X);
  el.querySelector("#ay").innerHTML = md(t.Y);
  const vote = el.querySelector(".vote");
  [["X", "X is better"], ["tie", "Tie"], ["Y", "Y is better"]].forEach(([v, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (g === v) b.className = "on";
    b.onclick = () => pick(t.id, v);
    vote.appendChild(b);
  });
  el.querySelector("#prev").onclick = () => { cur = (cur + TASKS.length - 1) % TASKS.length; render(); scrollTo(0, 0); };
  el.querySelector("#next").onclick = () => { cur = (cur + 1) % TASKS.length; render(); scrollTo(0, 0); };
}

async function pick(id, v) {
  grades[id] = v;
  try { localStorage.setItem("sc-grades", JSON.stringify(grades)); } catch (e) {}
  render();
  if (ref) {
    try { await ref.set({ grades, at: Date.now() }); saveMsg = "Saved"; }
    catch (e) { saveMsg = "Not saved (" + (e.code || "error") + ")"; }
    render();
  }
}

render();

(async () => {
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const id = user && await user.id();
  if (!db || !id) { saveMsg = "Sign in to save"; render(); return; }
  ref = db.doc("grades/" + id);
  try {
    const snap = await ref.get();
    if (snap.exists) grades = Object.assign({}, snap.data().grades, grades);
    saveMsg = "Saved";
    if (Object.keys(grades).length) await ref.set({ grades, at: Date.now() });
  } catch (e) { saveMsg = "Not saved (" + (e.code || "error") + ")"; }
  render();
})();
</script>
